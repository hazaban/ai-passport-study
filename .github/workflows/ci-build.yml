name: ESP-IDF Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # release-v5.5 持续跟踪 ESP-IDF release/v5.5 分支（当前即 v5.5.3，与 dependencies.lock 一致）。
      # 官方镜像已内置完整 ESP-IDF（含 esp_wifi/lib 等全部子模块）+ 工具链 + Python venv，
      # 用 Docker 层缓存代替 git clone --recurse-submodules + install.sh，又快又稳。
      IDF_IMG: espressif/idf:release-v5.5
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Pull ESP-IDF image
      run: docker pull "$IDF_IMG"

    - name: Build firmware
      run: |
        set -e
        docker run --rm \
          -v "$PWD:/project" -w /project \
          --entrypoint bash \
          -e HOME=/tmp \
          -e IDF_GIT_SAFE_DIR='*' \
          "$IDF_IMG" -lc '
            set -e
            . "$IDF_PATH/export.sh" >/dev/null
            # 语音包 mp3 -> opus(.frc) 需要 ffmpeg(含 libopus)
            apt-get update -qq && apt-get install -y -qq ffmpeg >/dev/null
            idf.py set-target esp32c3
            # set-target 后再生成 wav/.frc，并 reconfigure 让 voicepack 分区镜像进入构建图，最后 build。
            python3 tools/build_voice_spiffs.py
            idf.py reconfigure
            idf.py build
          '

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-bins
        path: |
          build/**/*.bin
          build/*.bin
        if-no-files-found: error