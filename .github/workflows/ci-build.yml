name: ESP-IDF Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install prerequisites and ESP-IDF
      run: |
        set -e
        mkdir -p $HOME/esp
        cd $HOME/esp
        # Retry clone to tolerate transient network errors
        for i in 1 2 3; do
          git clone --branch v5.2 --depth 1 --recurse-submodules https://github.com/espressif/esp-idf.git esp-idf && break || sleep 10
        done
        cd esp-idf
        sudo apt-get update || true
        ./install.sh
        # Source the export script for the rest of the steps
        . $HOME/esp/esp-idf/export.sh
        idf.py --version
      shell: bash

    - name: Detect project directory
      id: detect
      run: |
        if [ -f ./CMakeLists.txt ]; then
          echo "project=./" >> $GITHUB_OUTPUT
        elif [ -f ./ai-passport-study-main/CMakeLists.txt ]; then
          echo "project=./ai-passport-study-main" >> $GITHUB_OUTPUT
        elif [ -f ./app_study/CMakeLists.txt ]; then
          echo "project=./" >> $GITHUB_OUTPUT
        else
          echo "project=" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Build project
      if: steps.detect.outputs.project != ''
      run: |
        set -e
        echo "Building project in '${{ steps.detect.outputs.project }}'"
        cd "${{ steps.detect.outputs.project }}"
        . $HOME/esp/esp-idf/export.sh
        idf.py set-target esp32c3
        idf.py build
      shell: bash

    - name: Upload firmware artifacts
      if: steps.detect.outputs.project != ''
      uses: actions/upload-artifact@v4
      with:
        name: firmware-bins
        path: |
          ${{ steps.detect.outputs.project }}/build/**/*.bin
          ${{ steps.detect.outputs.project }}/build/*.bin

    - name: Fail if project not found
      if: steps.detect.outputs.project == ''
      run: |
        echo "Could not find project CMakeLists.txt in repo; adjust workflow or repository layout." && exit 1
      shell: bash
